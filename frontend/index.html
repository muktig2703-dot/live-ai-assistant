<!DOCTYPE html>
<html>
<head>
    <title>Live AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

    <div class="header">

        <h1>🤖 Live AI Assistant</h1>

        <button id="theme-btn" onclick="toggleTheme()">
            🌙 Dark Mode
        </button>

    </div>

    <button onclick="clearChat()">
        Clear Chat
    </button>

    <div id="chat-box"></div>

    <div class="input-area">

    <input
        type="text"
        id="message"
        placeholder="Type a message..."
    >

    <button onclick="startListening()">
        🎤
    </button>

    <button onclick="sendMessage()">
        Send
    </button>

    <button id="voice-btn" onclick="toggleVoice()">
    🔊 Voice ON
</button>

</div>

</div>

    <script src="script.js"></script>

</body>
</html>
