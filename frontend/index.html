<!DOCTYPE html>
<html>
<head>
    <title>Live AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Live AI Assistant</h1>

        <div id="chat-box"></div>

        <div class="input-area">
            <input
                type="text"
                id="message"
                placeholder="Type a message..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
