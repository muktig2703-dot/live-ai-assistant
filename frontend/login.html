<!DOCTYPE html>
<html>

<head>
    <title>Login | Lumina AI</title>

    <link rel="stylesheet" href="auth.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
    <img src="assets/logo.png" alt="Lumina AI">
    <h1>Lumina AI</h1>
</div>

        <p class="auth-subtitle">
            Illuminate Every Conversation
        </p>

        <h2>Welcome Back</h2>

        <input
            id="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>

<script src="script.js"></script>

</html>
