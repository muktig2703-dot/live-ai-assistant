<!DOCTYPE html>
<html>

<head>
    <title>Register | Lumina AI</title>

    <link rel="stylesheet" href="auth.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
    <img src="assets/logo.png" alt="Lumina AI">
    <h1>Lumina AI</h1>
</div>
        <p class="auth-subtitle">
            Illuminate Every Conversation
        </p>

        <h2>Create Account</h2>

        <input
            id="name"
            placeholder="Name"
        >

        <input
            id="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button onclick="register()">
            Register
        </button>

        <a href="login.html">
            Already have an account?
        </a>

    </div>

</div>

<script src="script.js"></script>

</html>
