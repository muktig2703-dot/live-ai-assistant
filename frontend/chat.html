<!DOCTYPE html>
<html>
<head>
    <title>Lumina AI</title>
    <link rel="stylesheet" href="style.css">
    <link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
/>
<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
    <img src="assets/logo.png" alt="Lumina AI Logo">
    <span>Lumina AI</span>
</div>

        <input
    type="text"
    id="chat-search"
    placeholder="🔍 Search chats..."
    onkeyup="filterChats()"
/>

        <button
    id="new-chat-btn"
    onclick="createNewChat()"
>
            + New Chat
        </button>
    <div id="chat-list">
            <!-- Chats appear here -->
        </div>
        <div class="profile-section">

    <button id="profile-btn">
        👤 My Profile
    </button>

    <button onclick="logout()">
        🚪 Logout
    </button>

</div>
    </div>

    <!-- MAIN CHAT -->

    <div class="container">

        <div class="header">

    <div class="chat-title">
        Lumina AI
    </div>

    <div>

        <select id="model-select">
            <option value="openai/gpt-4o-mini">
                GPT-4o Mini
            </option>

            <option value="anthropic/claude-3-haiku">
                Claude Haiku
            </option>

            <option value="google/gemini-2.5-flash">
                Gemini 2.5 Flash
            </option>

            <option value="deepseek/deepseek-chat">
                DeepSeek Chat
            </option>

        </select>

        <button
            id="theme-btn"
            onclick="toggleTheme()"
        >
            🌙 Dark Mode
        </button>

    </div>

</div>
        <div class="chat-controls">

        <button onclick="exportChat()">
    📄 Export TXT
</button>

<button onclick="exportPDF()">
    📕 Export PDF
</button>

<button onclick="shareChat()">
    🔗 Share Chat
</button> 

        <button onclick="clearChat()">
            Clear Chat
        </button>
        </div>

        <div id="chat-box">

    <div id="welcome-screen">

        <div class="welcome-robot">
            🤖
        </div>

        <h2>Hi, I'm Lumina</h2>

        <p>
            Your AI companion for coding,
            learning, documents and productivity.
        </p>

        <div class="suggested-prompts">

            <button onclick="usePrompt('Build a Python project')">
                Build a Python Project
            </button>

            <button onclick="usePrompt('Explain a concept')">
                Explain a Concept
            </button>

            <button onclick="usePrompt('Summarize a PDF')">
                Summarize a PDF
            </button>

            <button onclick="usePrompt('Prepare me for an interview')">
                Prepare for Interview
            </button>

        </div>

    </div>

    <div id="drop-zone">
        📂 Drag & Drop Files Here
    </div>

</div>

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type a message..."
            >

            <button onclick="startListening()">
                🎤
            </button>
<input
    type="file"
    id="file-input"
    accept=".pdf,.docx,.txt,.png,.jpg,.jpeg"
    hidden
>

<button onclick="selectFile()">
    📎
</button>

            <button onclick="sendMessage()">
                Send
            </button>

            <button
    id="stop-btn"
    onclick="stopGeneration()"
    style="display:none;"
>
    ⏹ Stop
</button>

            <button id="voice-btn" onclick="toggleVoice()">
                🔊 Voice ON
            </button>

        </div>

    </div>

</div>

<div id="upload-progress-container">

    <div id="upload-progress-bar"></div>

</div>
<div id="profile-modal" class="profile-modal">

    <div class="profile-card">

        <h2>My Profile</h2>

        <input
            id="profile-name"
            placeholder="Name"
        >

        <input
            id="profile-email"
            placeholder="Email"
        >

        <button onclick="updateProfile()">
            Save Changes
        </button>

        <button onclick="closeProfile()">
            Close
        </button>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="script.js"></script>

</body>
</html>
